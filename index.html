
<!DOCTYPE html>
<html>
<head>
    <title>Doctor Appointment Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="doctor">
        <img src="m.png" alt="Doctor">
    </div>

    <div class="form">
        <h2>Doctor Appointment Form</h2>

        <form>
            <label>Appointment Date</label>
            <input type="date">

            <label>Appointment Time</label>
            <input type="time">

            <label>Name</label>
            <input type="text" placeholder="First Name">
            <input type="text" placeholder="Last Name">
<br>
            <label>Gender</label>
        
            
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female

            <label>Phone</label>
            <input type="tel" placeholder="Phone">

            <label>Address</label>
            <input type="text" placeholder="City">
            <input type="text" placeholder="Country">

            <label>Your Query</label>
            <textarea rows="3"></textarea>

            <label>Appointment Type</label>
            <p>Select which appointment type(s) you require:</p>
<br>
            <input type="checkbox"> Cervix checkup<br>
            <input type="checkbox"> Heart checkup <br>
            <input type="checkbox"> Eye check-up <br>
            <input type="checkbox"> Hearing test<br><br>

            <button type="submit">Send</button>
        </form>
    </div>

</div>

</body>
</html>
